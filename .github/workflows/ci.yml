name: .NET SDK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/DTrac.Nrl2.Tests/DTrac.Nrl2.Tests.csproj
      - name: Build SDK
        run: dotnet build src/DTrac.Nrl2/DTrac.Nrl2.csproj --configuration Release
      - name: Build examples
        run: dotnet build examples/DTrac.Nrl2.Console/DTrac.Nrl2.Console.csproj --configuration Release
      - name: Build simulator
        run: dotnet build src/DTrac.Nrl2.Simulator/DTrac.Nrl2.Simulator.csproj --configuration Release
      - name: Build relay host
        run: dotnet build src/DTrac.Nrl2.Host/DTrac.Nrl2.Host.csproj --configuration Release
      - name: Test
        run: dotnet test tests/DTrac.Nrl2.Tests/DTrac.Nrl2.Tests.csproj --configuration Release
      - name: Pack SDK
        run: dotnet pack src/DTrac.Nrl2/DTrac.Nrl2.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: DTrac.Nrl2-nupkg
          path: artifacts/*.nupkg

  diagnostic-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish no-install RC-3040S diagnostic EXE
        shell: pwsh
        run: |
          dotnet publish src/DTrac.Nrl2.Diagnostic/DTrac.Nrl2.Diagnostic.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/RC3040S-Diagnostic.exe)) { throw "Missing portable EXE" }
      - name: Offline diagnostic smoke test (no network)
        shell: pwsh
        run: |
          & dist/RC3040S-Diagnostic.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Show SHA256
        shell: pwsh
        run: Get-FileHash dist/RC3040S-Diagnostic.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: RC3040S-Diagnostic-Windows-x64
          path: dist/RC3040S-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30

  at-tester-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable WebSocket AT test package
        shell: pwsh
        run: |
          dotnet publish src/DTrac.Nrl2.AtTester/DTrac.Nrl2.AtTester.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o dist-at
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist-at/RC3040S-AT-Tester.exe)) { throw "Missing AT test EXE" }
          Copy-Item docs/RC3040S-AT-test-package-zh-CN.md dist-at/README-AT-TEST-ZH-CN.md
      - name: No-network AT tester smoke test
        shell: pwsh
        run: |
          & dist-at/RC3040S-AT-Tester.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA256 for tester EXE
        shell: pwsh
        run: Get-FileHash dist-at/RC3040S-AT-Tester.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: RC3040S-AT-Tester-Windows-x64
          path: |
            dist-at/RC3040S-AT-Tester.exe
            dist-at/README-AT-TEST-ZH-CN.md
          if-no-files-found: error
          retention-days: 30
